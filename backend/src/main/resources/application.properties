# ==============================
# APPLICATION
# ==============================
spring.application.name=driveease-api
spring.profiles.default=dev

# ==============================
# DATABASE
# ==============================
spring.datasource.url=jdbc:postgresql://localhost:5432/driveease
spring.datasource.username=driveease_user
spring.datasource.password=driveease@123
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA
# ==============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.format_sql=false

# ==============================
# FLYWAY
# ==============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==============================
# SERVER
# ==============================
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.compression.enabled=true
server.tomcat.connection-timeout=60s
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=20MB

# ==============================
# MULTIPART
# ==============================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=100MB

# ==============================
# JACKSON
# ==============================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ==============================
# PAGINATION
# ==============================
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# ==============================
# MAIL (SMTP) — Gmail App Password
# ==============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=looserrr234@gmail.com
spring.mail.password=jxijkkabkscveeny
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================
# DRIVEEASE
# ==============================
driveease.jwt.secret=driveease-development-only-secret-key-change-me-32b
driveease.jwt.issuer=driveease-api
driveease.jwt.access-token-ttl-seconds=3600
driveease.jwt.refresh-token-ttl-seconds=604800
driveease.jwt.reset-token-ttl-minutes=30
driveease.jwt.cookie.refresh-name=driveease_refresh
driveease.jwt.cookie.secure=false
driveease.jwt.cookie.same-site=Lax
driveease.jwt.cookie.domain=
driveease.jwt.cookie.path=/api/v1/auth

driveease.cors.allowed-origins=http://localhost:5173

driveease.payment.gateway-mode=SANDBOX
driveease.payment.failure-threshold-amount=100000.00
driveease.payment.reference-prefix=DE-TXN

driveease.booking.max-advance-days=180
driveease.booking.min-rental-days=1
driveease.booking.max-rental-days=60

# Email delivery — smtp means send for real; mock means log to console only
driveease.email.provider=smtp
driveease.email.from=looserrr234@gmail.com
driveease.email.from-name=DriveEase
driveease.email.app-base-url=http://localhost:5173

# Fleet registration
driveease.fleet.auto-verify=false

driveease.uploads.directory=./uploads

# ==============================
# MANAGEMENT
# ==============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ==============================
# SPRINGDOC
# ==============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json

# ==============================
# LOGGING
# ==============================
logging.level.root=INFO
logging.level.com.driveease=INFO
logging.level.org.hibernate.SQL=WARN
