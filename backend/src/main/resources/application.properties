# ==============================
# APPLICATION
# ==============================
spring.application.name=driveease-api
spring.profiles.default=dev

# ==============================
# SERVER
# Render injects PORT at runtime; fall back to 8080 locally.
# ==============================
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.compression.enabled=true
server.tomcat.connection-timeout=60s
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=20MB

# ==============================
# DATABASE — from environment variables
# ==============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/driveease}
spring.datasource.username=${DB_USERNAME:driveease_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA
# ==============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ==============================
# FLYWAY
# ==============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Fail fast if the database is unreachable. Without this, Flyway retries
# for 60+ seconds before Render's health check gives up.
spring.flyway.connect-retries=3
spring.flyway.connect-retries-interval=3
# Hikari connection timeout — 10s is plenty. Default is 30s.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=15000

# ==============================
# MULTIPART
# ==============================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=100MB

# ==============================
# JACKSON
# ==============================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ==============================
# PAGINATION
# ==============================
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# ==============================
# MAIL (SMTP) — from environment variables
# Set EMAIL_PROVIDER=smtp plus SMTP_* env vars for real delivery.
# ==============================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================
# DRIVEEASE — JWT
# JWT_SECRET must be set via env var. The default only works locally.
# ==============================
driveease.jwt.secret=${JWT_SECRET:driveease-development-only-secret-key-change-me-32b}
driveease.jwt.issuer=driveease-api
driveease.jwt.access-token-ttl-seconds=${JWT_ACCESS_EXPIRATION:3600}
driveease.jwt.refresh-token-ttl-seconds=${JWT_REFRESH_EXPIRATION:604800}
driveease.jwt.reset-token-ttl-minutes=${PASSWORD_RESET_EXPIRATION:30}
driveease.jwt.cookie.refresh-name=driveease_refresh
driveease.jwt.cookie.secure=${COOKIE_SECURE:true}
driveease.jwt.cookie.same-site=${COOKIE_SAME_SITE:None}
driveease.jwt.cookie.domain=${COOKIE_DOMAIN:}
driveease.jwt.cookie.path=/api/v1/auth

# ==============================
# DRIVEEASE — CORS
# ==============================
driveease.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# ==============================
# DRIVEEASE — Payments
# ==============================
driveease.payment.gateway-mode=${PAYMENT_GATEWAY_MODE:SANDBOX}
driveease.payment.failure-threshold-amount=100000.00
driveease.payment.reference-prefix=DE-TXN

# ==============================
# DRIVEEASE — Booking
# ==============================
driveease.booking.max-advance-days=180
driveease.booking.min-rental-days=1
driveease.booking.max-rental-days=60

# ==============================
# DRIVEEASE — Email
# ==============================
driveease.email.provider=${EMAIL_PROVIDER:mock}
driveease.email.from=${EMAIL_FROM:no-reply@driveease.app}
driveease.email.from-name=${EMAIL_FROM_NAME:DriveEase}
driveease.email.app-base-url=${APP_BASE_URL:http://localhost:5173}

# ==============================
# DRIVEEASE — Fleet
# ==============================
driveease.fleet.auto-verify=${FLEET_AUTO_VERIFY:false}

# ==============================
# DRIVEEASE — Uploads
# ==============================
driveease.uploads.directory=${UPLOADS_DIR:./uploads}

# ==============================
# DRIVEEASE — Seeder
# ==============================
driveease.seed.enabled=${SEED_DEMO_DATA:false}

# ==============================
# MANAGEMENT
# ==============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ==============================
# SPRINGDOC
# ==============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json

# ==============================
# LOGGING
# ==============================
logging.level.root=INFO
logging.level.com.driveease=INFO
logging.level.org.hibernate.SQL=WARN
