# =============================================================================
# DriveEase API - development profile
# Overrides for the base application.properties. Only settings that DIFFER
# from the base belong here.
# =============================================================================
spring:
  jpa:
    show-sql: false
  flyway:
    clean-disabled: false
    baseline-on-migrate: false

driveease:
  seed:
    enabled: false

logging:
  level:
    com.driveease: DEBUG
    org.springframework.security: INFO
    org.springframework.mail: DEBUG
